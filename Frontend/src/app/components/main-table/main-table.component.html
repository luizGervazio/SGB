<div class="main-content" [class.closed]="isSidebarClosed">
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Disponível</th>
          <th>Páginas</th>
          <th>Ano</th>
          <th>Gênero</th>
          <th>Editora</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let livro of livrosFiltrados()">
          <td>{{ livro.id }}</td>
          <td>{{ livro.titulo }}</td>
          <td>
            <span [ngClass]="livro.disponivel ? 'disponivel' : 'emprestado'">
              {{ livro.disponivel ? 'Disponível' : 'Emprestado' }}
            </span>
          </td>
          <td>{{ livro.paginas }}</td>
          <td>{{ livro.ano }}</td>
          <td>{{ livro.genero }}</td>
          <td>{{ livro.editora }}</td>
          <td>
            <div class="action-buttons">
              <button (click)="openEditBookModal(livro)" class="btn btn-warning">
                <i class="fas fa-edit"></i> Editar
              </button>
              <button (click)="openRemoveBookModal(livro)" class="btn btn-danger">
                <i class="fas fa-trash"></i> Remover
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal de Remoção -->
<app-remove-book-modal
  [isOpen]="showRemoveBookModal"
  [book]="bookToRemove"
  (close)="closeRemoveBookModal()"
  (remove)="removeBook($event)"
></app-remove-book-modal>

<!-- Modal de Edição -->
<app-edit-book-modal
  [isOpen]="showEditBookModal"
  [book]="selectedBook"
  (close)="closeEditBookModal()"
  (updateBook)="updateBook($event)"
></app-edit-book-modal>
