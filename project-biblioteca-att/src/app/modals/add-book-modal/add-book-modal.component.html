<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal">
    <button class="close-button" (click)="cancel()">×</button>
    <h3>Adicionar Novo Livro</h3>

    <form>
      <label>Título:</label>
      <input type="text" [(ngModel)]="newBook.titulo" name="titulo" />

      <label>Páginas:</label>
      <input type="number" [(ngModel)]="newBook.paginas" name="paginas" />

      <label>Ano:</label>
      <input type="number" [(ngModel)]="newBook.ano" name="ano" />

      <label>Gênero:</label>
      <input type="text" [(ngModel)]="newBook.genero" name="genero" />

      <label>Editora:</label>
      <input type="text" [(ngModel)]="newBook.editora" name="editora" />

      <label>Autores:</label>
      <select [(ngModel)]="newBook.autores" name="autores" multiple>
        <option *ngFor="let autor of autoresDisponiveis" [ngValue]="autor.id">
          {{ autor.nome }}
        </option>
      </select>

      <label>Status:</label>
      <select [(ngModel)]="newBook.disponivel" name="disponivel">
        <option [ngValue]="true">Disponível</option>
        <option [ngValue]="false">Emprestado</option>
      </select>
    </form>

    <div class="buttons">
      <button class="btn btn-cancel" (click)="cancel()">Cancelar</button>
      <button class="btn btn-confirm" (click)="submit()">Adicionar Livro</button>
    </div>
  </div>
</div>

<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
