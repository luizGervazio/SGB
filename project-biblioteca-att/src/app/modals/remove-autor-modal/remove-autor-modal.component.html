<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal">
    <button class="close-button" (click)="cancel()">×</button>
    <h3>Remover Autor</h3>
    <p>
      Tem certeza que deseja remover o autor<br>
      <strong>{{ autor?.nome }}</strong> (ID: <strong>{{ autor?.id }}</strong>)?
    </p>

    <div class="buttons">
      <button class="btn btn-cancel" (click)="cancel()">Cancelar</button>
      <button class="btn btn-confirm" (click)="confirmRemove()">Remover</button>
    </div>
  </div>
</div>


<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
