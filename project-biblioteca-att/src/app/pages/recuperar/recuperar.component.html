<div class="body">
  <div class="login-container">
    <form>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Digite seu e-mail"
        />
      </div>
      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
