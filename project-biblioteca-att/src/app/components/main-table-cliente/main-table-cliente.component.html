<div class="main-content" [class.closed]="isSidebarClosed">
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Telefone</th>
          <th>CPF</th>
          <th>Endereço</th>
          <th>Número</th>
          <th>Cidade</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientesFiltrados()">
          <td>{{ cliente.id }}</td>
          <td>{{ cliente.nome }}</td>
          <td>{{ cliente.email }}</td>
          <td>{{ cliente.telefone }}</td>
          <td>{{ cliente.cpf }}</td>
          <td>{{ cliente.endereco }}</td>
          <td>{{ cliente.numero }}</td>
          <td>{{ cliente.cidade }}</td>
          <td>{{ cliente.status }}</td>
          <td>
            <div class="action-buttons">
              <button (click)="openEditClienteModal(cliente)" class="btn btn-warning">
                <i class="fas fa-edit"></i> Editar
              </button>
              <button (click)="openRemoveClienteModal(cliente)" class="btn btn-danger">
                <i class="fas fa-trash"></i> Remover
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-remove-cliente-modal
  [isOpen]="showRemoveClienteModal"
  [cliente]="clienteToRemove"
  (close)="closeRemoveClienteModal()"
  (remove)="removeCliente($event)"
></app-remove-cliente-modal>
