server {
    listen 8080;
    server_name _;

    # Não expõe a versão do Nginx em headers e páginas de erro
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Repassa /api/* para o contêiner da API pela rede interna do Compose.
    # A barra final em proxy_pass remove o prefixo /api.
    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do Angular caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
