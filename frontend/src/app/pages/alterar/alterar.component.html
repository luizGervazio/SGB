<div class="auth-page">
  <app-auth-brand></app-auth-brand>

  <main class="auth-panel">
    <div class="auth-card">
      <img src="app/assets/logo.png" alt="Library Manager" class="auth-logo" />
      <h2>Definir nova senha</h2>
      <p class="subtitle">Cole o token recebido por e-mail e escolha uma nova senha.</p>

      <form [formGroup]="alterarForm" (ngSubmit)="alterarSenha()">
        <div class="field">
          <label for="token">Token</label>
          <div class="input-icon">
            <lucide-icon name="key-round" [size]="18"></lucide-icon>
            <input id="token" class="input" type="text" formControlName="token" placeholder="Token recebido por e-mail" />
          </div>
        </div>

        <div class="field">
          <label for="novaSenha">Nova senha</label>
          <div class="input-icon">
            <lucide-icon name="lock" [size]="18"></lucide-icon>
            <input id="novaSenha" class="input" type="password" formControlName="novaSenha" placeholder="••••••••" autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block">
          <lucide-icon name="circle-check" [size]="18"></lucide-icon>
          Salvar nova senha
        </button>

        <div class="notice success" *ngIf="mensagem">
          <lucide-icon name="circle-check" [size]="18"></lucide-icon>
          <span>{{ mensagem }}</span>
        </div>
        <div class="notice error" *ngIf="erro">
          <lucide-icon name="circle-x" [size]="18"></lucide-icon>
          <span>{{ erro }}</span>
        </div>
      </form>

      <a routerLink="/login" class="back-link">
        <lucide-icon name="arrow-left" [size]="16"></lucide-icon>
        Voltar para o login
      </a>
    </div>
  </main>
</div>

<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
