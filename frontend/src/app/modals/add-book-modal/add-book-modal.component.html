<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-icon"><lucide-icon name="book-open" [size]="20"></lucide-icon></span>
      <div>
        <h3>Novo livro</h3>
        <p>Cadastre um livro no acervo.</p>
      </div>
      <button class="icon-btn" type="button" title="Fechar" (click)="cancel()">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <div class="modal-body">
      <form class="form-grid">
        <div class="field span-2">
          <label for="titulo">Título</label>
          <input id="titulo" type="text" [(ngModel)]="newBook.titulo" name="titulo" placeholder="Ex.: Dom Casmurro" />
        </div>

        <div class="field">
          <label for="genero">Gênero</label>
          <input id="genero" type="text" [(ngModel)]="newBook.genero" name="genero" placeholder="Ex.: Romance" />
        </div>

        <div class="field">
          <label for="editora">Editora</label>
          <input id="editora" type="text" [(ngModel)]="newBook.editora" name="editora" placeholder="Ex.: Garnier" />
        </div>

        <div class="field">
          <label for="ano">Ano</label>
          <input id="ano" type="number" [(ngModel)]="newBook.ano" name="ano" placeholder="1899" />
        </div>

        <div class="field">
          <label for="paginas">Páginas</label>
          <input id="paginas" type="number" [(ngModel)]="newBook.paginas" name="paginas" placeholder="256" />
        </div>

        <div class="field span-2">
          <label for="autores">Autores</label>
          <select id="autores" [(ngModel)]="newBook.autores" name="autores" multiple>
            <option *ngFor="let item of autoresDisponiveis" [ngValue]="item.id">{{ item.nome }}</option>
          </select>
          <span class="hint">Segure Ctrl para selecionar mais de um autor.</span>
        </div>

        <div class="field span-2">
          <label for="disponivel">Status</label>
          <select id="disponivel" [(ngModel)]="newBook.disponivel" name="disponivel">
            <option [ngValue]="true">Disponível</option>
            <option [ngValue]="false">Emprestado</option>
          </select>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn-primary" type="button" (click)="submit()">
        <lucide-icon name="plus" [size]="18"></lucide-icon>
        Adicionar livro
      </button>
    </div>
  </div>
</div>

<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
