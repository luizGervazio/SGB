<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-icon"><lucide-icon name="pencil" [size]="20"></lucide-icon></span>
      <div>
        <h3>Editar empréstimo</h3>
        <p>Atualize datas e situação.</p>
      </div>
      <button class="icon-btn" type="button" title="Fechar" (click)="cancel()">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <div class="modal-body">
      <form class="form-grid" *ngIf="editedEmprestimo">
        <div class="field span-2">
          <label for="clienteId">Cliente</label>
          <select id="clienteId" [(ngModel)]="editedEmprestimo.clienteId" name="clienteId" required>
            <option *ngFor="let item of clientes" [value]="item.id">{{ item.nome }}</option>
          </select>
        </div>

        <div class="field span-2">
          <label for="livroId">Livro</label>
          <select id="livroId" [(ngModel)]="editedEmprestimo.livroId" name="livroId" required>
            <option *ngFor="let item of livros" [value]="item.id">{{ item.titulo }}</option>
          </select>
        </div>

        <div class="field">
          <label for="dataEmprestimo">Data de retirada</label>
          <input id="dataEmprestimo" type="datetime-local" [(ngModel)]="editedEmprestimo.dataEmprestimo" name="dataEmprestimo" />
        </div>

        <div class="field">
          <label for="dataDevolucao">Devolução prevista</label>
          <input id="dataDevolucao" type="datetime-local" [(ngModel)]="editedEmprestimo.dataDevolucao" name="dataDevolucao" />
        </div>

        <div class="field">
          <label for="atraso">Em atraso?</label>
          <select id="atraso" [(ngModel)]="editedEmprestimo.atraso" name="atraso">
            <option [ngValue]="false">Não</option>
            <option [ngValue]="true">Sim</option>
          </select>
        </div>

        <div class="field">
          <label for="statusEmprestismo">Situação</label>
          <select id="statusEmprestismo" [(ngModel)]="editedEmprestimo.statusEmprestismo" name="statusEmprestismo">
            <option [ngValue]="true">Em andamento</option>
            <option [ngValue]="false">Devolvido</option>
          </select>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn-primary" type="button" (click)="saveChanges()">
        <lucide-icon name="circle-check" [size]="18"></lucide-icon>
        Salvar alterações
      </button>
    </div>
  </div>
</div>

<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
