<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal modal-sm" role="alertdialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-icon danger"><lucide-icon name="trash-2" [size]="20"></lucide-icon></span>
      <div>
        <h3>Remover empréstimo</h3>
        <p>Esta ação não pode ser desfeita.</p>
      </div>
      <button class="icon-btn" type="button" title="Fechar" (click)="cancel()">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <div class="modal-body">
      <p>Tem certeza que deseja remover este empréstimo? Se estiver em andamento, o livro volta a ficar disponível.</p>
      <div class="confirm-target">
        <lucide-icon name="arrow-left-right" [size]="22"></lucide-icon>
        <div>
          <strong>{{ emprestimo?.livros?.titulo || "Empréstimo" }}</strong>
          <span>Empréstimo #{{ emprestimo?.id }} · {{ emprestimo?.cliente?.nome }}</span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn-danger" type="button" (click)="confirmRemove()">
        <lucide-icon name="trash-2" [size]="18"></lucide-icon>
        Remover
      </button>
    </div>
  </div>
</div>

<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
