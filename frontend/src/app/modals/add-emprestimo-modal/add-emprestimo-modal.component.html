<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-icon"><lucide-icon name="arrow-left-right" [size]="20"></lucide-icon></span>
      <div>
        <h3>Novo empréstimo</h3>
        <p>Registre a retirada de um livro.</p>
      </div>
      <button class="icon-btn" type="button" title="Fechar" (click)="cancel()">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <div class="modal-body">
      <form class="form-grid">
        <div class="field span-2">
          <label for="clienteId">Cliente</label>
          <select id="clienteId" [(ngModel)]="newEmprestimo.clienteId" name="clienteId" required>
            <option *ngFor="let item of clientes" [value]="item.id">{{ item.nome }}</option>
          </select>
        </div>

        <div class="field span-2">
          <label for="livroId">Livro</label>
          <select id="livroId" [(ngModel)]="newEmprestimo.livroId" name="livroId" required>
            <option *ngFor="let item of livros" [value]="item.id">{{ item.titulo }}</option>
          </select>
        </div>

        <div class="field">
          <label for="dataEmprestimo">Data de retirada</label>
          <input id="dataEmprestimo" type="date" [(ngModel)]="newEmprestimo.dataEmprestimo" name="dataEmprestimo" />
        </div>

        <div class="field">
          <label for="dataDevolucao">Devolução prevista</label>
          <input id="dataDevolucao" type="date" [(ngModel)]="newEmprestimo.dataDevolucao" name="dataDevolucao" />
        </div>

        <div class="field">
          <label for="atraso">Em atraso?</label>
          <select id="atraso" [(ngModel)]="newEmprestimo.atraso" name="atraso">
            <option [ngValue]="false">Não</option>
            <option [ngValue]="true">Sim</option>
          </select>
        </div>

        <div class="field">
          <label for="statusEmprestismo">Situação</label>
          <select id="statusEmprestismo" [(ngModel)]="newEmprestimo.statusEmprestismo" name="statusEmprestismo">
            <option [ngValue]="true">Em andamento</option>
            <option [ngValue]="false">Devolvido</option>
          </select>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn-primary" type="button" (click)="submit()">
        <lucide-icon name="plus" [size]="18"></lucide-icon>
        Registrar empréstimo
      </button>
    </div>
  </div>
</div>

<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
