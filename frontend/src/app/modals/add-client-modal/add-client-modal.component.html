<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-icon"><lucide-icon name="users" [size]="20"></lucide-icon></span>
      <div>
        <h3>Novo cliente</h3>
        <p>Cadastre um leitor da biblioteca.</p>
      </div>
      <button class="icon-btn" type="button" title="Fechar" (click)="cancel()">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <div class="modal-body">
      <form class="form-grid">
        <div class="field span-2">
          <label for="Nome">Nome completo</label>
          <input id="Nome" type="text" [(ngModel)]="newCliente.nome" name="Nome" placeholder="Ex.: Ana Souza" />
        </div>

        <div class="field">
          <label for="Email">E-mail</label>
          <input id="Email" type="email" [(ngModel)]="newCliente.email" name="Email" placeholder="ana@exemplo.com" />
        </div>

        <div class="field">
          <label for="Telefone">Telefone</label>
          <input id="Telefone" type="tel" [(ngModel)]="newCliente.telefone" name="Telefone" placeholder="(41) 99999-0000" />
        </div>

        <div class="field">
          <label for="CPF">CPF</label>
          <input id="CPF" type="text" [(ngModel)]="newCliente.cpf" name="CPF" placeholder="000.000.000-00" />
        </div>

        <div class="field">
          <label for="Status">Status</label>
          <select id="Status" [(ngModel)]="newCliente.status" name="Status">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>

        <div class="field">
          <label for="Endereco">Endereço</label>
          <input id="Endereco" type="text" [(ngModel)]="newCliente.endereco" name="Endereco" placeholder="Rua, avenida..." />
        </div>

        <div class="field">
          <label for="Numero">Número</label>
          <input id="Numero" type="text" [(ngModel)]="newCliente.numero" name="Numero" placeholder="120" />
        </div>

        <div class="field span-2">
          <label for="Cidade">Cidade</label>
          <input id="Cidade" type="text" [(ngModel)]="newCliente.cidade" name="Cidade" placeholder="Curitiba" />
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn-primary" type="button" (click)="submit()">
        <lucide-icon name="plus" [size]="18"></lucide-icon>
        Adicionar cliente
      </button>
    </div>
  </div>
</div>

<app-message-modal
  [isOpen]="showMessageModal"
  [type]="messageType"
  [title]="messageTitle"
  [description]="messageDescription"
  (close)="showMessageModal = false"
></app-message-modal>
