<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal message-modal" [ngClass]="type" role="alertdialog" aria-modal="true">
    <div class="message-icon">
      <lucide-icon [name]="icone" [size]="30" [strokeWidth]="2"></lucide-icon>
    </div>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>

    <div class="actions">
      <ng-container *ngIf="type === 'remove' || type === 'edit'; else soFechar">
        <button class="btn btn-secondary" type="button" (click)="handleClose()">Cancelar</button>
        <button
          class="btn"
          type="button"
          [ngClass]="type === 'remove' ? 'btn-danger' : 'btn-primary'"
          (click)="handleConfirm()"
        >
          Confirmar
        </button>
      </ng-container>
      <ng-template #soFechar>
        <button class="btn btn-primary" type="button" (click)="handleClose()">Entendi</button>
      </ng-template>
    </div>
  </div>
</div>
