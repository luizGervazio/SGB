<div class="modal-overlay" (click)="onClose()">
  <div class="modal detalhes" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <button class="icon-btn fechar" type="button" title="Fechar" (click)="onClose()">
      <lucide-icon name="x" [size]="20"></lucide-icon>
    </button>

    <div class="detalhes-grid">
      <div class="capa" [style.background]="capa">
        <lucide-icon name="book-open" [size]="28" [strokeWidth]="1.75"></lucide-icon>
        <span class="capa-titulo">{{ livro.titulo }}</span>
        <span class="capa-autor">{{ autores }}</span>
      </div>

      <div class="conteudo">
        <span class="badge badge-success">Disponível para empréstimo</span>
        <h2>{{ livro.titulo }}</h2>
        <p class="autor">
          <lucide-icon name="user-round" [size]="16"></lucide-icon>
          {{ autores }}
        </p>

        <dl class="ficha">
          <div>
            <dt><lucide-icon name="tag" [size]="15"></lucide-icon> Gênero</dt>
            <dd>{{ livro.genero }}</dd>
          </div>
          <div>
            <dt><lucide-icon name="calendar" [size]="15"></lucide-icon> Ano</dt>
            <dd>{{ livro.ano }}</dd>
          </div>
          <div>
            <dt><lucide-icon name="file-text" [size]="15"></lucide-icon> Páginas</dt>
            <dd>{{ livro.paginas }}</dd>
          </div>
          <div>
            <dt><lucide-icon name="building-2" [size]="15"></lucide-icon> Editora</dt>
            <dd>{{ livro.editora }}</dd>
          </div>
        </dl>

        <div class="notice info">
          <lucide-icon name="circle-alert" [size]="18"></lucide-icon>
          <span>Para retirar este livro, procure o balcão da biblioteca com seu cadastro de cliente.</span>
        </div>
      </div>
    </div>
  </div>
</div>
