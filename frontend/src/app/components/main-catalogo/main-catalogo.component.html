<div class="catalogo-wrap">
  <div class="filtros card">
    <div class="input-icon filtro-busca">
      <lucide-icon name="search" [size]="18"></lucide-icon>
      <input
        type="search"
        class="input"
        placeholder="Buscar por título, autor ou gênero..."
        [(ngModel)]="filtro"
      />
    </div>

    <div class="filtro-select">
      <lucide-icon name="tag" [size]="16"></lucide-icon>
      <select class="input" [(ngModel)]="categoria" aria-label="Categoria">
        <option value="">Todas as categorias</option>
        <option *ngFor="let c of categorias" [value]="c">{{ c }}</option>
      </select>
    </div>

    <div class="filtro-select">
      <lucide-icon name="sliders-horizontal" [size]="16"></lucide-icon>
      <select class="input" [(ngModel)]="ordem" aria-label="Ordenar por">
        <option value="titulo">Ordenar por título</option>
        <option value="autor">Ordenar por autor</option>
        <option value="recentes">Mais recentes</option>
        <option value="antigos">Mais antigos</option>
      </select>
    </div>
  </div>

  <p class="resultado" *ngIf="livros.length">
    {{ livrosFiltrados().length }} de {{ totalDisponiveis }} títulos
    <button *ngIf="filtro || categoria" class="link limpar" type="button" (click)="limparFiltros()">Limpar filtros</button>
  </p>

  <main class="grid-livros">
    <app-card *ngFor="let livro of livrosFiltrados()" [livro]="livro" (click)="abrirDetalhes(livro)"></app-card>
  </main>

  <div class="card empty-state" *ngIf="livros.length && livrosFiltrados().length === 0">
    <lucide-icon name="search" [size]="40" [strokeWidth]="1.5"></lucide-icon>
    <strong>Nenhum livro encontrado</strong>
    Tente outro termo ou limpe os filtros.
  </div>
</div>

<app-card-detalhes *ngIf="livroSelecionado" [livro]="livroSelecionado" (fechar)="livroSelecionado = null"></app-card-detalhes>
