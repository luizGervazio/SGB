<header class="fixed-header" [class.closed]="isSidebarClosed">
  <div class="header-content">
    <div class="header-title">
      <span class="title-icon"><lucide-icon [name]="icon" [size]="20"></lucide-icon></span>
      <div>
        <h2>{{ title }}</h2>
        <p *ngIf="subtitle">{{ subtitle }}</p>
      </div>
    </div>

    <div class="header-search input-icon">
      <lucide-icon name="search" [size]="18"></lucide-icon>
      <input
        type="search"
        class="input"
        [placeholder]="placeholder || 'Buscar...'"
        [(ngModel)]="searchTerm"
        (input)="onSearch.emit(searchTerm)"
      />
    </div>

    <button (click)="openModal()" class="btn btn-primary">
      <lucide-icon name="plus" [size]="18"></lucide-icon>
      <span class="header-add-label">{{ addButtonLabel || 'Adicionar' }}</span>
    </button>
  </div>
</header>

<app-add-client-modal
  [isOpen]="showAddBookModal"
  (close)="closeModal()"
  (addClient)="handleAddClient($event)"
></app-add-client-modal>
