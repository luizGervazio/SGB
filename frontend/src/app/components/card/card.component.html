<article class="livro-card" tabindex="0" role="button" [attr.aria-label]="'Ver detalhes de ' + livro.titulo">
  <div class="capa" [style.background]="capa">
    <div class="capa-lombada"></div>
    <div class="capa-conteudo">
      <lucide-icon name="book-open" [size]="22" [strokeWidth]="1.75"></lucide-icon>
      <span class="capa-titulo">{{ livro.titulo }}</span>
      <span class="capa-autor">{{ autores }}</span>
    </div>
    <span class="capa-ver">
      <lucide-icon name="arrow-right" [size]="16"></lucide-icon>
      Ver detalhes
    </span>
  </div>

  <div class="info">
    <span class="chip">{{ livro.genero }}</span>
    <h3>{{ livro.titulo }}</h3>
    <p class="meta">
      <lucide-icon name="user-round" [size]="14"></lucide-icon>
      {{ autores }}
    </p>
    <p class="meta">
      <lucide-icon name="calendar" [size]="14"></lucide-icon>
      {{ livro.ano }} · {{ livro.paginas }} páginas
    </p>
  </div>
</article>
