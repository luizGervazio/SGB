<section class="page-body" [class.closed]="isSidebarClosed">
  <div class="card table-card">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th>Autor</th>
            <th class="col-actions">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let autor of autoresFiltrados()">
            <td class="col-id">#{{ autor.id }}</td>
            <td>
              <div class="person">
                <span class="avatar">{{ iniciais(autor.nome) }}</span>
                <span class="cell-strong">{{ autor.nome }}</span>
              </div>
            </td>
            <td class="col-actions">
              <div class="row-actions">
                <button class="icon-btn edit" title="Editar autor" (click)="openEditAutorModal(autor)">
                  <lucide-icon name="pencil" [size]="17"></lucide-icon>
                </button>
                <button class="icon-btn delete" title="Remover autor" (click)="openRemoveAutorModal(autor)">
                  <lucide-icon name="trash-2" [size]="17"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="autoresFiltrados().length === 0">
            <td colspan="3">
              <div class="empty-state">
                <lucide-icon name="inbox" [size]="40" [strokeWidth]="1.5"></lucide-icon>
                <strong>Nenhum autor encontrado</strong>
                {{ filtro ? 'Tente buscar por outro termo.' : 'Cadastre o primeiro em Novo autor.' }}
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<app-remove-autor-modal
  [isOpen]="showRemoveAutorModal"
  [autor]="autorToRemove"
  (close)="closeRemoveAutorModal()"
  (remove)="removeAutor($event)"
></app-remove-autor-modal>

<app-edit-autor-modal
  [isOpen]="showEditAutorModal"
  [autor]="selectedAutor"
  (close)="closeEditAutorModal()"
  (updateAutor)="updateAutor($event)"
></app-edit-autor-modal>
